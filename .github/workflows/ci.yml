name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate formula Ruby
        run: |
          ruby -c Formula/holler.rb

      - name: Check publisher script
        run: shellcheck scripts/publish-holler-formula

  formula:
    name: Binary formula (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          fi
          brew tap 72olabs/tap "$GITHUB_WORKSPACE"
          brew install 72olabs/tap/holler

      - name: Test formula
        run: brew test holler

      - name: Audit formula
        run: brew audit --strict 72olabs/tap/holler

      - name: Reinstall packaged version
        run: |
          brew reinstall 72olabs/tap/holler
          brew test holler
